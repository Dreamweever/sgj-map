<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>통합 작전판</title>
<!--
  통합 작전판: 위쪽 탭으로 각 작전판을 오갑니다.
  - 같은 폴더에 singi.html(신기 쟁탈전), nakwa.html(낙화의 전장)이 있어야 합니다.
  - 주소 끝의 #방이름은 각 작전판으로 그대로 전달됩니다. (예: index.html#munpa)
  - 한 번 연 탭은 계속 살아 있어서, 탭을 오가도 실시간 연결과 화면 인식이 끊기지 않습니다.
  - 새 작전판을 만들면 아래 PAGES에 한 줄 추가하면 됩니다.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@700&family=IBM+Plex+Sans+KR:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#D5DCD9; --surface:#ECF0EE; --ink:#16252A; --muted:#536569; --line:#B6C3C0; --focus:#1C7469;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101B1E; --surface:#172529; --ink:#E2EBE9; --muted:#8C9FA2; --line:#2B3E44; --focus:#5CC2B4;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101B1E; --surface:#172529; --ink:#E2EBE9; --muted:#8C9FA2; --line:#2B3E44; --focus:#5CC2B4;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font:15px/1.5 "IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);
  overflow-x:auto;flex:none}
.brand{font-family:Hahmlet,"Nanum Myeongjo",serif;font-weight:700;font-size:1.05rem;margin-right:8px;white-space:nowrap}
.tab{font:inherit;font-weight:600;font-size:.92rem;white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--ink);
  border-radius:999px;padding:7px 16px;min-height:38px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.room{margin-left:auto;color:var(--muted);font-size:.8rem;white-space:nowrap;padding-left:8px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.frames{flex:1;position:relative;min-height:0}
.frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.frames iframe[hidden]{display:none}
</style>
</head>
<body>
<nav class="bar" role="tablist" aria-label="작전판 선택">
  <span class="brand">통합 작전판</span>
  <span id="tabs" style="display:contents"></span>
  <span class="room" id="room"></span>
</nav>
<main class="frames" id="frames"></main>

<script>
(() => {
'use strict';
// 작전판 목록. 새 콘텐츠를 만들면 여기에 추가한다.
const PAGES = [
  {id:'singi', title:'신기 쟁탈전', src:'singi.html'},
  {id:'nakwa', title:'낙화의 전장', src:'nakwa.html'}
];
const ROOM = ((location.hash || '').slice(1).match(/^[A-Za-z0-9-]{1,40}$/) || [])[0] || 'main';
const frames = {};
let cur = '';
try { cur = localStorage.getItem('shell-tab') || ''; } catch(e){}
if (!PAGES.some(p => p.id === cur)) cur = PAGES[0].id;

document.getElementById('room').textContent = '방: ' + ROOM;
document.getElementById('tabs').innerHTML = PAGES.map(p =>
  `<button type="button" class="tab" role="tab" data-page="${p.id}" aria-controls="frame-${p.id}">${p.title}</button>`).join('');

function show(id){
  cur = id;
  try { localStorage.setItem('shell-tab', id); } catch(e){}
  const page = PAGES.find(p => p.id === id);
  // 처음 여는 탭만 불러오고, 한 번 연 탭은 숨겼다 보였다만 한다.
  if (!frames[id]){
    const f = document.createElement('iframe');
    f.id = 'frame-' + id;
    f.title = page.title + ' 작전판';
    f.allow = 'display-capture; clipboard-write';
    f.src = page.src + '#' + ROOM;
    document.getElementById('frames').appendChild(f);
    frames[id] = f;
  }
  for (const k in frames) frames[k].hidden = k !== id;
  for (const b of document.querySelectorAll('.tab')) b.setAttribute('aria-selected', String(b.dataset.page === id));
  document.title = page.title + ' 작전판';
}
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (b) show(b.dataset.page);
});
window.addEventListener('hashchange', () => location.reload());
show(cur);
})();
</script>
</body>
</html>
